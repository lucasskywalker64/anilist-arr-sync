name: Nightly release
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.guard.outputs.changed }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      publish_ghcr: ${{ steps.identity.outputs.publish_ghcr }}
      publish_dockerhub: ${{ steps.identity.outputs.publish_dockerhub }}
    env:
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      RELEASE_PUBLISH_GHCR: ${{ vars.RELEASE_PUBLISH_GHCR }}
      RELEASE_PUBLISH_DOCKERHUB: ${{ vars.RELEASE_PUBLISH_DOCKERHUB }}
      GH_TOKEN: ${{ github.token }}
      PUBLIC_SOURCE: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pin exact develop identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLIC_SOURCE" = true || { echo 'Release source must remain publicly accessible' >&2; exit 1; }
          for flag in RELEASE_PUBLISH_GHCR RELEASE_PUBLISH_DOCKERHUB; do
            value=${!flag-}
            if [ "$value" != true ] && [ "$value" != false ]; then
              echo "$flag must be explicitly set to 'true' or 'false'" >&2
              exit 1
            fi
          done
          commit=$(git rev-parse HEAD)
          base=$(git tag --sort=-version:refname | { grep -m1 -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; })
          base=${base:-v0.0.0}
          version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_ghcr=$RELEASE_PUBLISH_GHCR" >> "$GITHUB_OUTPUT"
          echo "publish_dockerhub=$RELEASE_PUBLISH_DOCKERHUB" >> "$GITHUB_OUTPUT"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Compare authenticated last published nightly
        id: guard
        run: |
          go run ./cmd/release check-key
          python packaging/release.py nightly-guard
  build:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 60
    env:
      RELEASE_MODE: nightly
      PACKAGE_LICENSE: AGPL-3.0-only
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_COMMIT: ${{ needs.guard.outputs.commit }}
      RELEASE_INSTALL_TEST: '1'
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - name: Require all nightly signing and publication inputs
        shell: pwsh
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_PUBLISH_DOCKERHUB: ${{ needs.guard.outputs.publish_dockerhub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          $required = [System.Collections.Generic.List[string]]@('MINISIGN_PUBLIC_KEY', 'MINISIGN_PRIVATE_KEY', 'MINISIGN_PASSWORD')
          if ($env:RELEASE_PUBLISH_DOCKERHUB -ceq 'true') {
            $required.AddRange([string[]]@('DOCKERHUB_USERNAME', 'DOCKERHUB_TOKEN'))
          }
          foreach ($name in $required) {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing $name" }
          }
      - name: Build signed-checksum nightly using OSS snapshot mode
        shell: pwsh
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          go run ./cmd/release config
          if ($LASTEXITCODE -ne 0) { throw 'Release configuration failed' }
          goreleaser release --config .release-tools/goreleaser.yaml --snapshot --clean --fail-fast --parallelism=1 --skip=publish,docker,scoop,aur
          if ($LASTEXITCODE -ne 0) { throw 'Nightly packaging failed' }
          go run ./cmd/release export dist
          if ($LASTEXITCODE -ne 0) { throw 'Final-byte verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-final
          path: .release/final/*
          if-no-files-found: error
          retention-days: 3
  containers:
    needs: [guard, build]
    if: needs.guard.outputs.publish_ghcr == 'true' || needs.guard.outputs.publish_dockerhub == 'true'
    uses: ./.github/workflows/release-containers.yml
    permissions:
      contents: read
      packages: write
    with:
      commit: ${{ needs.guard.outputs.commit }}
      version: ${{ needs.guard.outputs.version }}
      mode: nightly
      artifact: nightly-final
      publish_ghcr: ${{ needs.guard.outputs.publish_ghcr == 'true' }}
      publish_dockerhub: ${{ needs.guard.outputs.publish_dockerhub == 'true' }}
    secrets: inherit
  publish:
    needs: [guard, build, containers]
    if: >-
      always() &&
      needs.guard.result == 'success' &&
      needs.guard.outputs.changed == 'true' &&
      needs.build.result == 'success' &&
      (needs.containers.result == 'success' || needs.containers.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_MODE: nightly
      RELEASE_VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_COMMIT: ${{ needs.guard.outputs.commit }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: nightly-final
          path: .release/final
      - name: Publish rolling prerelease after container success
        run: python packaging/release.py publish-nightly
