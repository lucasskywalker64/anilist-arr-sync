name: Verify release packaging
on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - 'Dockerfile'
      - 'LICENSE'
      - 'SOURCE.md'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'legal.go'
      - 'packaging/**'
      - 'cmd/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - '.github/actions/release-tools/**'
      - '.github/actions/production-release/**'
      - '.github/workflows/release*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify publication failure paths
        run: python -m unittest discover -s packaging -p '*_test.py'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and typecheck embedded UI
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check audited runtime licenses and notices
        run: python packaging/licenses.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: web/dist/*
          if-no-files-found: error
          retention-days: 3
  snapshot:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RELEASE_MODE: fixture
      RELEASE_SNAPSHOT_TEST: '1'
      RELEASE_INSTALL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          frontend-artifact: release-frontend
      - name: Verify installer process failure paths
        shell: pwsh
        run: ./packaging/test-installer-process.ps1
      - name: Build and verify disposable-key snapshot
        run: go test -v ./cmd/release -run '^TestSnapshot$' -count=1 -timeout=30m
      - name: Verify native Chocolatey installer selection without installation
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'amd64' }
          ./packaging/test-chocolatey.ps1 -ExpectedArchitecture $arch
      - name: Verify production action command boundaries
        run: node --test packaging/production.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-${{ runner.arch }}
          path: .release/final/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-trust-${{ runner.arch }}
          path: .release/fixture-public-key.txt
          if-no-files-found: error
          retention-days: 3
  containers:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: fixture-ARM64
          path: .release/final
      - uses: actions/download-artifact@v4
        with:
          name: fixture-trust-ARM64
          path: .release
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Load disposable fixture verification inputs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          identity = json.loads(Path('.release/final/release.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('MINISIGN_PUBLIC_KEY=' + Path('.release/fixture-public-key.txt').read_text().strip() + '\n')
              output.write('RELEASE_MODE=fixture\nRELEASE_VERSION=' + identity['version'] + '\nRELEASE_COMMIT=' + identity['commit'] + '\n')
          PY
      - name: Verify both container architectures without publication
        env:
          RELEASE_CONTAINER_TEST: '1'
        run: go test ./cmd/release -run '^TestContainerArtifacts$' -count=1 -timeout=15m
