name: Publish verified containers
on:
  workflow_call:
    inputs:
      commit: {type: string, required: true}
      version: {type: string, required: true}
      mode: {type: string, required: true}
      artifact: {type: string, required: true}
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: .release/final
      - name: Verify final artifacts and stage the same Linux executables
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          go run ./cmd/release verify .release/final
          for arch in amd64 arm64; do
            mkdir -p ".release/container/linux/$arch"
            tar -xzf ".release/final/anilist-arr-sync_${RELEASE_VERSION}_linux_${arch}.tar.gz" -C ".release/container/linux/$arch" anilist-arr-sync
          done
          cp Dockerfile .release/container/Dockerfile
          mkdir -p .release/container/packaging
          cp -r packaging/container-config .release/container/packaging/container-config
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both multiarch registries
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_MODE" = nightly ]; then
            tags=(--tag ghcr.io/lucasskywalker64/anilist-arr-sync:develop --tag "$DOCKERHUB_USERNAME/anilist-arr-sync:develop")
          elif [ "$RELEASE_MODE" = production ]; then
            tags=(--tag "ghcr.io/lucasskywalker64/anilist-arr-sync:$RELEASE_VERSION" --tag ghcr.io/lucasskywalker64/anilist-arr-sync:latest --tag "$DOCKERHUB_USERNAME/anilist-arr-sync:$RELEASE_VERSION" --tag "$DOCKERHUB_USERNAME/anilist-arr-sync:latest")
          else
            echo 'Container publication requires production or nightly mode' >&2
            exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push "${tags[@]}" --label "org.opencontainers.image.revision=$RELEASE_COMMIT" --label "org.opencontainers.image.version=$RELEASE_VERSION" .release/container
