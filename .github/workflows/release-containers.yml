name: Publish verified containers
on:
  workflow_call:
    inputs:
      commit: {type: string, required: true}
      version: {type: string, required: true}
      mode: {type: string, required: true}
      artifact: {type: string, required: true}
      sign_windows: {type: string, required: false, default: 'false'}
      publish_ghcr: {type: boolean, required: true}
      publish_dockerhub: {type: boolean, required: true}
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_SIGN_WINDOWS: ${{ inputs.sign_windows }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: .release/final
      - name: Verify final artifacts and stage the same Linux executables
        run: |
          set -euo pipefail
          go run ./cmd/release verify .release/final
          for arch in amd64 arm64; do
            mkdir -p ".release/container/linux/$arch"
            tar -xzf ".release/final/anilist-arr-sync_${RELEASE_VERSION}_linux_${arch}.tar.gz" -C ".release/container/linux/$arch" anilist-arr-sync
          done
          cp Dockerfile .release/container/Dockerfile
          mkdir -p .release/container/packaging
          cp -r packaging/container-config .release/container/packaging/container-config
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify runtime health before registry login or publication
        env:
          RELEASE_CONTAINER_TEST: '1'
        run: go test ./cmd/release -run '^TestContainerArtifacts$' -count=1 -timeout=15m
      - uses: docker/login-action@v3
        if: inputs.publish_ghcr
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        if: inputs.publish_dockerhub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish enabled multiarch registries
        shell: bash
        env:
          PUBLISH_GHCR: ${{ inputs.publish_ghcr }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          tags=()
          if [ "$RELEASE_MODE" = nightly ]; then
            if [ "$PUBLISH_GHCR" = true ]; then
              tags+=(--tag ghcr.io/lucasskywalker64/anilist-arr-sync:develop)
            fi
            if [ "$PUBLISH_DOCKERHUB" = true ]; then
              test -n "$DOCKERHUB_USERNAME" || { echo 'DOCKERHUB_USERNAME is required' >&2; exit 1; }
              tags+=(--tag "$DOCKERHUB_USERNAME/anilist-arr-sync:develop")
            fi
          elif [ "$RELEASE_MODE" = production ]; then
            if [ "$PUBLISH_GHCR" = true ]; then
              tags+=(--tag "ghcr.io/lucasskywalker64/anilist-arr-sync:$RELEASE_VERSION" --tag ghcr.io/lucasskywalker64/anilist-arr-sync:latest)
            fi
            if [ "$PUBLISH_DOCKERHUB" = true ]; then
              test -n "$DOCKERHUB_USERNAME" || { echo 'DOCKERHUB_USERNAME is required' >&2; exit 1; }
              tags+=(--tag "$DOCKERHUB_USERNAME/anilist-arr-sync:$RELEASE_VERSION" --tag "$DOCKERHUB_USERNAME/anilist-arr-sync:latest")
            fi
          else
            echo 'Container publication requires production or nightly mode' >&2
            exit 1
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo 'At least one container registry must be enabled' >&2
            exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push "${tags[@]}" --label "org.opencontainers.image.revision=$RELEASE_COMMIT" --label "org.opencontainers.image.version=$RELEASE_VERSION" .release/container
