name: Temporary runner performance probe
on:
  pull_request:
    paths: ['.github/workflows/runner-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        sample: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Measure identical workloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path $env:RUNNER_TEMP ('runner-probe-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          public static class RunnerProbe {
              public static ulong Cpu() {
                  ulong value = 14695981039346656037UL;
                  for (int i = 0; i < 200000000; i++) value = unchecked((value ^ (ulong)i) * 1099511628211UL);
                  return value;
              }
              public static void WriteFiles(string directory) {
                  Directory.CreateDirectory(directory);
                  var bytes = new byte[4096];
                  new Random(42).NextBytes(bytes);
                  for (int i = 0; i < 2000; i++) File.WriteAllBytes(Path.Combine(directory, i + ".bin"), bytes);
              }
              public static long ReadFiles(string directory) {
                  long bytes = 0;
                  foreach (var file in Directory.GetFiles(directory)) bytes += File.ReadAllBytes(file).Length;
                  return bytes;
              }
              public static void CopyFiles(string source, string destination) {
                  Directory.CreateDirectory(destination);
                  foreach (var file in Directory.GetFiles(source)) File.Copy(file, Path.Combine(destination, Path.GetFileName(file)));
              }
          }
          '@
          function Get-PeMachine([string]$File) {
              $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($File))
              try {
                  $reader.BaseStream.Position = 0x3c
                  $offset = $reader.ReadInt32()
                  $reader.BaseStream.Position = $offset + 4
                  return '0x{0:x4}' -f $reader.ReadUInt16()
              } finally { $reader.Dispose() }
          }
          $measurements = [ordered]@{}
          function Measure-Probe([string]$Name, [scriptblock]$Work) {
              $times = @()
              foreach ($iteration in 1..3) {
                  $watch = [Diagnostics.Stopwatch]::StartNew()
                  & $Work | Out-Null
                  $watch.Stop()
                  $times += [Math]::Round($watch.Elapsed.TotalMilliseconds, 2)
              }
              $measurements[$Name] = $times
          }
          $git = (Get-Command git.exe).Source
          $gitTar = Join-Path (Split-Path (Split-Path $git)) 'usr/bin/tar.exe'
          $windowsTar = Join-Path $env:SystemRoot 'System32/tar.exe'
          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          $tools = @($git, $gitTar, $windowsTar, $pwsh) | ForEach-Object {
              [ordered]@{ path = $_; peMachine = Get-PeMachine $_; sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }
          }
          $data = Join-Path $probeRoot 'data'
          [RunnerProbe]::WriteFiles($data)
          $archive = Join-Path $probeRoot 'data.tar'
          & $windowsTar -cf $archive -C $data .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare matched archive' }
          $checksum = [RunnerProbe]::Cpu()
          Measure-Probe 'native_cpu_200m_ms' { [RunnerProbe]::Cpu() }
          Measure-Probe 'native_write_2000_files_ms' { [RunnerProbe]::WriteFiles((Join-Path $probeRoot ([Guid]::NewGuid().ToString('N')))) }
          Measure-Probe 'native_read_2000_files_ms' { [RunnerProbe]::ReadFiles($data) }
          Measure-Probe 'native_copy_2000_files_ms' { [RunnerProbe]::CopyFiles($data, (Join-Path $probeRoot ([Guid]::NewGuid().ToString('N')))) }
          foreach ($tar in @($windowsTar, $gitTar)) {
              $label = if ($tar -eq $windowsTar) { 'windows_tar_extract_ms' } else { 'git_tar_extract_ms' }
              $tarOptions = if ($tar -eq $gitTar) { @('--force-local') } else { @() }
              Measure-Probe $label {
                  $target = Join-Path $probeRoot ([Guid]::NewGuid().ToString('N'))
                  New-Item -ItemType Directory -Path $target | Out-Null
                  & $tar @tarOptions -xf $archive -C $target
                  if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
              }
          }
          Measure-Probe 'git_start_ms' { & $git --version; if ($LASTEXITCODE -ne 0) { throw 'Git failed' } }
          Measure-Probe 'pwsh_start_ms' { & $pwsh -NoProfile -NonInteractive -Command 'exit 0'; if ($LASTEXITCODE -ne 0) { throw 'PowerShell failed' } }
          $result = [ordered]@{
              runnerArch = $env:RUNNER_ARCH
              processArch = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
              os = [Runtime.InteropServices.RuntimeInformation]::OSDescription
              framework = [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
              cpu = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed)
              disk = @(Get-CimInstance Win32_DiskDrive | Select-Object Model, InterfaceType)
              imageVersion = $env:ImageVersion
              checksum = $checksum.ToString()
              payloadSha256 = (Get-FileHash -LiteralPath (Join-Path $data '0.bin') -Algorithm SHA256).Hash
              tools = $tools
              measurements = $measurements
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath result.json -Encoding utf8
          Get-Content result.json
      - uses: actions/upload-artifact@v4
        with:
          name: runner-probe-${{ matrix.os }}-${{ matrix.sample }}
          path: result.json
          if-no-files-found: error
          retention-days: 3
