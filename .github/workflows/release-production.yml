name: Production release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: '!contains(github.ref_name, ''-'')'
    # ARM Windows executes arm64 natively and amd64 through Windows emulation.
    # Both installer lifecycles must pass inside post-build hooks, before hashes.
    runs-on: windows-11-arm
    environment: release
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      sign_windows: ${{ steps.identity.outputs.sign_windows }}
      publish_ghcr: ${{ steps.identity.outputs.publish_ghcr }}
      publish_dockerhub: ${{ steps.identity.outputs.publish_dockerhub }}
      publish_winget: ${{ steps.identity.outputs.publish_winget }}
      publish_chocolatey: ${{ steps.identity.outputs.publish_chocolatey }}
    env:
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      RELEASE_SIGN_WINDOWS: ${{ vars.RELEASE_SIGN_WINDOWS }}
      RELEASE_PUBLISH_GHCR: ${{ vars.RELEASE_PUBLISH_GHCR }}
      RELEASE_PUBLISH_DOCKERHUB: ${{ vars.RELEASE_PUBLISH_DOCKERHUB }}
      RELEASE_PUBLISH_SCOOP: ${{ vars.RELEASE_PUBLISH_SCOOP }}
      RELEASE_PUBLISH_AUR: ${{ vars.RELEASE_PUBLISH_AUR }}
      RELEASE_PUBLISH_WINGET: ${{ vars.RELEASE_PUBLISH_WINGET }}
      RELEASE_PUBLISH_CHOCOLATEY: ${{ vars.RELEASE_PUBLISH_CHOCOLATEY }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      SCOOP_BUCKET_REPOSITORY: ${{ vars.SCOOP_BUCKET_REPOSITORY }}
      PACKAGE_LICENSE: AGPL-3.0-only
      RELEASE_INSTALL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity, feature flags, and credentials
        id: identity
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          PUBLIC_SOURCE: ${{ !github.event.repository.private }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PUBLIC_SOURCE -ne 'true') { throw 'Release source must remain publicly accessible' }
          if ($env:TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Production release requires a stable semantic version tag'
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must belong to main' }
          $commit = (git rev-parse HEAD).Trim()
          foreach ($flag in @(
            'RELEASE_SIGN_WINDOWS',
            'RELEASE_PUBLISH_GHCR',
            'RELEASE_PUBLISH_DOCKERHUB',
            'RELEASE_PUBLISH_SCOOP',
            'RELEASE_PUBLISH_AUR',
            'RELEASE_PUBLISH_WINGET',
            'RELEASE_PUBLISH_CHOCOLATEY'
          )) {
            $value = [Environment]::GetEnvironmentVariable($flag)
            if ($value -cne 'true' -and $value -cne 'false') {
              throw "$flag must be explicitly set to 'true' or 'false'"
            }
          }
          $required = [System.Collections.Generic.List[string]]@('MINISIGN_PUBLIC_KEY', 'MINISIGN_PRIVATE_KEY', 'MINISIGN_PASSWORD', 'PACKAGE_LICENSE')
          if ($env:RELEASE_SIGN_WINDOWS -ceq 'true') {
            $required.AddRange([string[]]@('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'))
          }
          if ($env:RELEASE_PUBLISH_SCOOP -ceq 'true') {
            $required.Add('SCOOP_BUCKET_TOKEN')
            if ($env:SCOOP_BUCKET_REPOSITORY -notmatch '^([^/]+)/([^/]+)$') { throw 'SCOOP_BUCKET_REPOSITORY must be owner/repository' }
            "SCOOP_BUCKET_OWNER=$($Matches[1])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "SCOOP_BUCKET_NAME=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          if ($env:RELEASE_PUBLISH_AUR -ceq 'true') { $required.Add('AUR_SSH_PRIVATE_KEY') }
          if ($env:RELEASE_PUBLISH_DOCKERHUB -ceq 'true') {
            $required.AddRange([string[]]@('DOCKERHUB_USERNAME', 'DOCKERHUB_TOKEN'))
          }
          if ($env:RELEASE_PUBLISH_WINGET -ceq 'true') { $required.Add('WINGET_TOKEN') }
          if ($env:RELEASE_PUBLISH_CHOCOLATEY -ceq 'true') { $required.Add('CHOCOLATEY_API_KEY') }
          foreach ($name in $required) {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing $name" }
          }
          foreach ($line in @('RELEASE_MODE=production', "RELEASE_VERSION=$env:TAG", "RELEASE_COMMIT=$commit")) {
            $line | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          foreach ($line in @(
            "version=$env:TAG",
            "commit=$commit",
            "sign_windows=$env:RELEASE_SIGN_WINDOWS",
            "publish_ghcr=$env:RELEASE_PUBLISH_GHCR",
            "publish_dockerhub=$env:RELEASE_PUBLISH_DOCKERHUB",
            "publish_winget=$env:RELEASE_PUBLISH_WINGET",
            "publish_chocolatey=$env:RELEASE_PUBLISH_CHOCOLATEY"
          )) {
            $line | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - uses: ./.github/actions/release-tools
      - name: Write release notes
        shell: pwsh
        run: |
          python packaging/release.py release-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
      - name: Build once, sign when enabled, test installers, hash, and publish
        uses: ./.github/actions/production-release
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-final
          path: .release/final/*
          if-no-files-found: error
          retention-days: 7
  containers:
    needs: release
    if: needs.release.outputs.publish_ghcr == 'true' || needs.release.outputs.publish_dockerhub == 'true'
    uses: ./.github/workflows/release-containers.yml
    permissions:
      contents: read
      packages: write
    with:
      mode: production
      version: ${{ needs.release.outputs.version }}
      commit: ${{ needs.release.outputs.commit }}
      artifact: production-final
      sign_windows: ${{ needs.release.outputs.sign_windows }}
      publish_ghcr: ${{ needs.release.outputs.publish_ghcr == 'true' }}
      publish_dockerhub: ${{ needs.release.outputs.publish_dockerhub == 'true' }}
    secrets: inherit
  packages:
    needs: release
    if: needs.release.outputs.publish_winget == 'true' || needs.release.outputs.publish_chocolatey == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_MODE: production
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
      RELEASE_SIGN_WINDOWS: ${{ needs.release.outputs.sign_windows }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      PACKAGE_LICENSE: AGPL-3.0-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: production-final
          path: .release/final
      - name: Verify published bytes and generate installer-based manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:RELEASE_VERSION --dir .release/published
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download published release' }
          go run ./cmd/release verify .release/published
          if ($LASTEXITCODE -ne 0) { throw 'Published bytes failed verification' }
          python packaging/manifests.py .release/published
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
      - name: Install and run WinGet manifest validator
        if: needs.release.outputs.publish_winget == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Scope CurrentUser -Repository PSGallery -Force
          Repair-WinGetPackageManager -Version 1.29.380 -Force
          $env:PATH += ";$env:LOCALAPPDATA\Microsoft\WindowsApps"
          winget validate --manifest .release/winget --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Invalid WinGet manifests' }
          gh release download v1.28.1.0 --repo microsoft/winget-create --pattern wingetcreate.exe --dir .release-tools
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download WinGet manifest tool' }
          $signature = Get-AuthenticodeSignature .release-tools/wingetcreate.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') { throw 'Untrusted WinGet tool' }
          if ((Get-FileHash .release-tools/wingetcreate.exe -Algorithm SHA256).Hash -ne '63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413') { throw 'Unexpected WinGet tool bytes' }
      - name: Submit WinGet manifests
        if: needs.release.outputs.publish_winget == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (!$env:WINGET_TOKEN) { throw 'WinGet credentials are required' }
          & .release-tools/wingetcreate.exe submit .release/winget --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed' }
      - name: Pack and submit Chocolatey
        if: needs.release.outputs.publish_chocolatey == 'true'
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if (!$env:CHOCOLATEY_API_KEY) { throw 'Chocolatey credentials are required' }
          choco pack .release/chocolatey/anilist-arr-sync.nuspec --outputdirectory .release/chocolatey --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed' }
          $package = (Get-ChildItem .release/chocolatey/*.nupkg).FullName
          choco push $package --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey submission failed' }
