name: Release tools and embedded frontend
description: Install pinned OSS packaging tools, then build the embedded frontend
inputs:
  frontend-artifact:
    description: Frontend artifact built and license-checked by this workflow
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Complete hosted ARM64 desktop setup
      if: runner.environment == 'github-hosted' && runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        # windows-11-arm can leave first-logon privacy setup blocking Explorer.
        # https://github.com/actions/runner-images/issues/14069
        $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
        New-Item -Path $policy -Force | Out-Null
        New-ItemProperty -Path $policy -Name DisablePrivacyExperience -Value 1 -PropertyType DWord -Force | Out-Null
        $session = [Diagnostics.Process]::GetCurrentProcess().SessionId
        $setup = Get-Process WWAHost -ErrorAction SilentlyContinue | Where-Object SessionId -eq $session
        Write-Host "Completing desktop setup in session $session ($(@($setup).Count) privacy setup processes)"
        $setup | Stop-Process -Force
    - name: Locate pinned Go toolchain
      id: go-toolchain
      shell: pwsh
      run: |
        $module = Get-Content go.mod -Raw
        if ($module -notmatch '(?m)^go ([0-9]+\.[0-9]+\.[0-9]+)\s*$') { throw 'Expected an exact Go version in go.mod' }
        $version = $Matches[1]
        $architecture = $env:RUNNER_ARCH.ToLowerInvariant()
        "version=$version" >> $env:GITHUB_OUTPUT
        "path=$(Join-Path $env:RUNNER_TOOL_CACHE "go/$version/$architecture")" >> $env:GITHUB_OUTPUT
    - name: Restore Go toolchain
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.go-toolchain.outputs.path }}
          ${{ steps.go-toolchain.outputs.path }}.complete
        key: release-go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.version }}
    - uses: actions/setup-go@v5
      id: go
      with:
        go-version-file: go.mod
        cache: false
    - name: Locate Go caches
      id: go-cache
      shell: pwsh
      run: |
        "build=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT
        "modules=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
        "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
    - uses: actions/cache@v4
      with:
        path: |
          ${{ steps.go-cache.outputs.build }}
          ${{ steps.go-cache.outputs.modules }}
        key: release-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ steps.go-cache.outputs.commit }}
        restore-keys: |
          release-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: ${{ inputs.frontend-artifact == '' && 'npm' || '' }}
        cache-dependency-path: web/package-lock.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@v4
      if: inputs.frontend-artifact != ''
      with:
        name: ${{ inputs.frontend-artifact }}
        path: web/dist
    - name: Build and typecheck embedded UI
      if: inputs.frontend-artifact == ''
      shell: pwsh
      working-directory: web
      run: |
        npm ci
        if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
        npm run check
        if ($LASTEXITCODE -ne 0) { throw 'Frontend typecheck failed' }
        npm run build
        if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
    - name: Check audited runtime licenses and notices
      if: inputs.frontend-artifact == ''
      shell: pwsh
      run: |
        python packaging/licenses.py --check
        if ($LASTEXITCODE -ne 0) { throw 'License notices require an audit and refresh' }
    - uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: v2.20.2
        install-only: true
    - name: Install Inno Setup 7.1.1
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download is-7_1_1 --repo jrsoftware/issrc --pattern innosetup-7.1.1-x64.exe --dir .release-tools
        if ($LASTEXITCODE -ne 0) { throw 'Cannot download Inno Setup' }
        $file = (Resolve-Path .release-tools/innosetup-7.1.1-x64.exe).Path
        if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Unexpected Inno Setup download' }
        if ((Get-AuthenticodeSignature -LiteralPath $file).Status -ne 'Valid') { throw 'Untrusted Inno Setup download' }
        $tool = Start-Process -FilePath $file -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS' -PassThru -Wait -WindowStyle Hidden
        if ($tool.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
        "${env:ProgramFiles}\Inno Setup 7" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Install signing bridge dependencies
      if: env.RELEASE_MODE == 'production'
      working-directory: packaging
      shell: pwsh
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        if ($LASTEXITCODE -ne 0) { throw 'Signing bridge installation failed' }
    - name: Install pinned official SignPath connector
      if: env.RELEASE_MODE == 'production'
      uses: actions/checkout@v4
      with:
        repository: SignPath/github-action-submit-signing-request
        ref: f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        path: .release-tools/signpath
        persist-credentials: false
