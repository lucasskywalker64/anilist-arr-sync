[config]
ai_timeout = 600
reasoning_effort = "high"
max_model_tokens = 256000

patch_extra_lines_before = 20
patch_extra_lines_after = 15
max_extra_lines_before_dynamic_context = 60

[ignore]
glob = [
  # Dependency lock and vendor files
  "go.sum",
  "vendor/**",

  # Compiled binaries, test outputs, and coverage
  "bin/**",
  "*.exe",
  "*.test",
  "*.out",
  "coverage.txt",
  "profile.cov",

  # Generated code (Protobuf, gRPC, mocks, SQL, GraphQL, Templ)
  "*.pb.go",
  "*_mock.go",
  "**/mock_*.go",
  "**/mocks/**",
  "*_gen.go",
  "**/generated/**",
  "**/sqlc/**",
  "**/*_templ.go",
  "wire_gen.go",
  "**/ent/**",

  # Build/packaging artifacts
  "dist/**"
]

[pr_reviewer]
# --- High-Signal Architectural & Safety Checks ---
require_security_review = true
require_tests_review = true
require_risk_assessment = true
require_merge_recommendation = true
require_priority_files = true

# --- Cut Low-Signal Noise ---
require_estimate_effort_to_review = false
require_estimate_contribution_time_cost = false
require_score_review = false
require_can_be_split_review = false
require_todo_scan = false
enable_review_labels_effort = false

# --- Clean PR Thread UX ---
persistent_comment = true
persistent_finding_state = true
enable_intro_text = false
enable_help_text = false

# --- Go-Specific Guidelines ---
extra_instructions = """
You are an expert Go (Golang) code review agent. Your objective is to review PRs with surgical precision, prioritizing runtime safety, concurrency hygiene, error wrapping, and system resilience over stylistic preferences.

## Operating Principles
1. Verify Correctness & Safety First: Identify logic bugs, memory leaks, data races, deadlocks, and unhandled errors.
2. Signal-to-Noise Ratio: Do not nitpick formatting (assume `gofmt` / `goimports` handles style) or trivial naming choices.
3. Analysis Over Diffs: Explain *why* an issue is risky, the failure scenario, and the architectural fix in prose. Do NOT write full replacement code blocks here (leave actionable snippets to code suggestions).
4. Silence on Clean Code: If a file contains no material issues, do not invent trivial observations.

## Technical Audit Checklist
### 1. Concurrency & Goroutine Safety
- Goroutine Leaks: Ensure all goroutines have a guaranteed exit path via `context.Context`, closed channels, or bounded termination conditions.
- Race Conditions: Check for shared mutable state accessed without synchronization (`sync.Mutex`, `sync.RWMutex`, atomic operations). Watch for pointer sharing across goroutines.
- Channels: Ensure channels have appropriate buffer sizes; avoid unbuffered channel deadlocks; ensure channel closure is owned by the sender, not the receiver.
- WaitGroups: Ensure `wg.Add()` is called before launching a goroutine, not inside it.
- sync.Pool / sync.Map: Verify instances are not copied by value after first use.

### 2. Error Handling & Control Flow
- Nil Error Wrapping: Flag ignored errors (`_ = ...`) unless explicitly documented as intentional.
- Error Inspection: Check for proper use of `errors.Is` and `errors.As` instead of direct equality checks (`err == targetErr`) or type assertions on wrapped errors (`fmt.Errorf("...: %w", err)`).
- Streams & I/O: On `json.Decoder`, `io.Reader`, and streaming payloads, verify complete consumption with `io.EOF` after closing delimiters. Ensure response bodies and file descriptors close on every error return path.
- Defer Caveats:
  - Watch for `defer` calls inside tight loops that accumulate memory or file descriptors until the enclosing function returns.
  - Check error return values on deferred calls that flush or close write-side resources (e.g., `defer f.Close()` where disk write errors must be checked).
- Panics: Flag naked `panic()` calls in production library code; enforce explicit error propagation.

### 3. Context Management
- Context Propagation: `context.Context` must always be the first parameter of a function, named `ctx`.
- Lifetime & Cancellation: Ensure `context.WithCancel`, `WithTimeout`, or `WithDeadline` calls invoke their `cancel` func (typically via `defer cancel()`) to prevent timer/resource leaks.
- Context Storage: Flag storing `context.Context` inside struct definitions unless following established framework lifecycles.

### 4. Memory, Slices, & Performance
- Slice Capacity: Verify appropriate pre-allocation (`make([]T, 0, cap)`) when the slice length is predictable to avoid repeated heap reallocations.
- Pointer vs. Value Semantics:
  - Methods on a struct should consistently use either value or pointer receivers, rarely mixed.
  - Watch for unintentional struct copies when structs contain synchronization primitives (e.g., `sync.Mutex`).
- Memory Retention: Look out for large backing arrays kept alive by slicing small subslices (e.g., `sub := largeBuffer[:10]`), or memory retained in long-lived slices/maps.

### 5. Idiomatic Architecture & Design
- Interface Design: Interfaces should generally be defined by the consumer, not the producer. Encourage minimal interfaces (`io.Reader`, single-method interfaces).
- Zero-Value Usability: Check if structs can be safely used in their zero-value state where practical.

### 6. Testing & Concurrency in Tests
- Test Goroutines: Do not call `t.Fatal` or `t.Fatalf` inside goroutines, background workers, or HTTP test handlers (`httptest.Server`, `http.HandlerFunc`). Calling `FailNow` only stops the running goroutine via `runtime.Goexit`, leaving the test hanging or failing with broken connection errors. Call `t.Error`/`t.Errorf` and return instead.
"""

[pr_code_suggestions]
# --- Suggestion Volume & Scope ---
num_code_suggestions_per_chunk = 4
focus_only_on_problems = true

# --- Quality & Noise Filtering ---
suggestions_score_threshold = 2

# --- GitHub Integration & Thread Cleanliness ---
committable_code_suggestions = true
persistent_comment = true

# --- Go-Specific Guidelines ---
